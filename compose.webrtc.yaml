# Canonical V2 WebRTC runtime selected by scripts/build-with-mihomo.sh
# for both Mihomo-assisted and --no-proxy image builds.
# Linux host networking is required: aioice allocates dynamic ICE UDP ports
# and must advertise real NAS/EasyTier addresses, not Docker bridge addresses.
# No runtime attachment to proxy-net or port publishing; scope NAS firewall
# access to trusted clients.
services:
  easyadb:
    image: easyadb:local
    restart: unless-stopped
    network_mode: host
    # Argument-vector command: no shell parsing of interface/port configuration.
    command: ["uvicorn", "server.app:app", "--host", "${EASYADB_BIND_IP:-127.0.0.1}", "--port", "${EASYADB_PORT:-8765}", "--workers", "1", "--ws", "wsproto"]
    environment:
      EASYADB_TOKEN: ${EASYADB_TOKEN:?Set EASYADB_TOKEN in .env}
      EASYADB_DB: /app/data/devices.sqlite3
      EASYADB_VIDEO_ENGINE: webrtc
      EASYADB_BIND_IP: ${EASYADB_BIND_IP:-127.0.0.1}
      EASYADB_PORT: ${EASYADB_PORT:-8765}
      EASYADB_MAX_STARTING: ${EASYADB_MAX_STARTING:-3}
    volumes:
      - ./data/adb:/root/.android
      - ./data/storage:/app/data
