# Linux NAS / EasyTier WebRTC runtime. Uses host networking because aioice
# allocates dynamic ICE UDP sockets and must advertise real NAS/EasyTier IPs,
# not unrouteable Docker bridge addresses. No Docker ports: host mode.
# Build still uses the selected Mihomo or direct BuildKit helper.
services:
  easyadb:
    image: easyadb:local
    restart: unless-stopped
    network_mode: host
    command: ["sh", "-c", "exec uvicorn server.app:app --host ${EASYADB_BIND_IP:-127.0.0.1} --port ${EASYADB_PORT:-8765} --workers 1 --ws wsproto"]
    environment:
      EASYADB_TOKEN: ${EASYADB_TOKEN:?Set EASYADB_TOKEN in .env}
      EASYADB_DB: /app/data/devices.sqlite3
      EASYADB_VIDEO_ENGINE: webrtc
      EASYADB_BIND_IP: ${EASYADB_BIND_IP:-127.0.0.1}
      EASYADB_PORT: ${EASYADB_PORT:-8765}
    volumes:
      - ./data/adb:/root/.android
      - ./data/storage:/app/data
