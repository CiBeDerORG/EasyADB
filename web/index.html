<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EasyADB · 设备管理</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0d1320;color:#eef3fb}
*{box-sizing:border-box}body{margin:0;padding:25px 15px}main{max-width:1220px;margin:auto}
h1{font-size:28px;margin:0 0 7px}h1 span{color:#80a4ff}h2{font-size:17px;margin:0}p{line-height:1.5}
.hint{color:#9baec9;font-size:13px}.grid{display:grid;grid-template-columns:minmax(310px,440px) 1fr;gap:17px;align-items:start}
.panel{background:#172233;border:1px solid #34445e;border-radius:14px;padding:20px;min-width:0}
.stack{display:grid;gap:16px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
label{display:block;font-size:13px;color:#c1d0e4;margin:10px 0 6px}
input{width:100%;height:40px;padding:0 11px;border-radius:8px;border:1px solid #50627d;background:#101a2a;color:#fff;font:inherit}
input:focus{outline:2px solid #7094ff;outline-offset:1px}
button{background:#4772e7;color:#fff;font-weight:650;padding:9px 12px;border:0;border-radius:8px;cursor:pointer}
button.secondary{background:#2a3b56;border:1px solid #516480}button.danger{background:#783345}
button:disabled{opacity:.5;cursor:not-allowed}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.two{display:grid;grid-template-columns:1fr 120px;gap:9px}.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#c7d7ed;margin-top:12px}
.check input{width:17px;height:17px;flex:none}
.status{background:#25344d;border-radius:8px;padding:11px;margin:13px 0 0;min-height:39px;font-size:13px;overflow-wrap:anywhere}
.status.ok{background:#194135;color:#a3efd0}.status.error{background:#4c2930;color:#ffc0c6}
.device-list{display:grid;gap:12px;max-height:650px;overflow-y:auto}
.device-group{border:1px solid #34445e;border-radius:10px;background:#142033;overflow:hidden}
.device-group>summary{display:flex;align-items:center;gap:9px;cursor:pointer;padding:12px 13px;font-weight:700;list-style:none}
.device-group>summary::-webkit-details-marker{display:none}
.device-group>summary:before{content:"▾";color:#9bb9f9;transition:transform .15s}
.device-group:not([open])>summary:before{transform:rotate(-90deg)}
.group-count{margin-left:auto;font-size:12px;font-weight:400;color:#a2b4ce}
.group-items{display:grid;gap:9px;padding:0 10px 10px}
.group-items .item{background:#101a2a}
[hidden]{display:none!important}
dialog.device-dialog{padding:0;color:#eef3fb;background:#172233;border:1px solid #405777;border-radius:16px;width:min(540px,calc(100% - 26px));max-height:min(92vh,820px);box-shadow:0 20px 70px #0009;overflow-y:auto}
dialog.device-dialog::backdrop{background:#030816b8;backdrop-filter:blur(3px)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #34445e;padding:18px 20px}
.modal-body{padding:7px 20px 20px}
.modal-head button{padding:5px 10px;font-size:20px;line-height:1.2}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:19px}
.modal-status{min-height:0;margin-top:12px}
.modal-status:empty{display:none}
.item{border:1px solid #40536f;border-radius:10px;padding:12px;background:#101a2a}
.item.active{border-color:#80a4ff;background:#1b2c47}.item-top{display:flex;justify-content:space-between;gap:12px}
.item-name{font-weight:700;font-size:14px;overflow-wrap:anywhere}.muted{font-size:12px;color:#a2b4ce;line-height:1.6;overflow-wrap:anywhere}
.pill{border-radius:20px;padding:4px 8px;font-size:11px;white-space:nowrap;height:max-content;background:#314359;color:#c9d5e6}
.pill.connected{background:#214b3d;color:#a4efd0}.pill.disconnected,.pill.error{background:#543139;color:#ffbbc4}
.pill.connecting,.pill.checking{background:#4c4023;color:#f6dd95}
.item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.item-actions button{font-size:12px;padding:6px 10px}
.screen{display:flex;justify-content:center;align-items:center;min-height:410px;background:#0a101b;border:1px dashed #475d7a;border-radius:11px;overflow:hidden}
.screen img{max-width:100%;max-height:72vh;width:auto;height:auto;object-fit:contain}
.screen img[hidden],.screen .placeholder[hidden]{display:none}.placeholder{text-align:center;color:#9babc2;font-size:13px;line-height:1.8;padding:25px}
details{margin-top:16px;border-top:1px solid #34445e;padding-top:14px}summary{cursor:pointer;font-weight:650}
@media(max-width:820px){.grid{grid-template-columns:1fr}.panel{padding:16px}body{padding:14px 10px}}
</style>
</head>
<body>
<main>
<header><h1>EasyADB <span>/ 多设备管理</span></h1><p class="hint">M1 · 保存多台设备、分别连接与截图，后台检查状态并按设置重连。暂不支持实时投屏或控制。</p></header>
<div class="grid">
 <div class="stack">
  <section class="panel">
   <h2>访问配置</h2>
   <label for="token">访问密钥（EASYADB_TOKEN）</label>
   <div class="two" style="grid-template-columns:1fr auto"><input id="token" type="password" autocomplete="off" placeholder="输入服务端访问密钥"><button id="load">加载设备</button></div>
   <p class="hint">密钥仅保存在当前页面内存中，刷新网页需重新输入。</p>
   <div id="message" role="status" aria-live="polite" class="status">请先输入访问密钥并加载设备</div>
  </section>
  <section class="panel">
   <div class="heading"><h2>设备列表</h2><div class="buttons" style="margin:0"><button id="newDevice" type="button" disabled>＋ 添加设备</button><button class="secondary" id="refreshAll" disabled>检查全部状态</button></div></div>
   <div class="muted" id="count">尚未加载</div><div class="device-list" id="devices" style="margin-top:12px"></div>
  </section>
  <!-- Add/edit form is an accessible native modal, not a permanent sidebar. -->
 </div>
 <section class="panel">
  <div class="heading"><div><h2 id="previewTitle">设备截图</h2><div class="muted" id="previewInfo">从左侧列表选择设备</div></div>
   <div class="buttons" style="margin:0"><button class="secondary" id="connect" disabled>连接设备</button><button id="shotButton" disabled>刷新截图</button></div>
  </div>
  <div class="screen"><div class="placeholder" id="placeholder">选择设备并建立 ADB 连接后，<br>点击「刷新截图」即可查看手机画面。</div><img id="shot" hidden alt="所选 Android 设备当前截图"></div>
  <p class="hint">截图按需获取；切换设备会清除旧画面，避免显示另一台手机的截图。所有设备的操作通过稳定设备 ID 定位。</p>
 </section>
</div>
<dialog class="device-dialog" id="deviceDialog" aria-labelledby="formTitle">
 <div class="modal-head"><h2 id="formTitle">添加设备</h2><button class="secondary" type="button" id="closeDialog" aria-label="关闭弹窗">×</button></div>
 <div class="modal-body">
  <form id="form">
   <label for="name">设备名称</label><input id="name" required maxlength="64" placeholder="例如：小米 11">
   <label for="group">设备分组（可选）</label><input id="group" maxlength="64" list="groupNames" placeholder="选择已有分组，或输入新分组"><datalist id="groupNames"></datalist>
   <div class="two"><div><label for="ip">手机 IPv4</label><input id="ip" required placeholder="192.168.31.100" spellcheck="false"></div>
   <div><label for="port">ADB 连接端口</label><input id="port" required type="number" min="1" max="65535" placeholder="动态端口"></div></div>
   <label class="check"><input type="checkbox" id="auto" checked>断线后自动尝试连接（每轮检测）</label>
   <div class="status error modal-status" id="formMessage" role="alert" hidden></div>
   <div class="modal-actions"><button class="secondary" id="cancelDialog" type="button">取消</button><button id="save" type="submit">保存设备</button></div>
  </form>
  <details><summary>第一次连接？先配对无线调试</summary>
   <p class="hint">手机无线调试 → 使用配对码配对设备。这里使用<strong>配对弹窗端口</strong>；设备记录应填写无线调试主页的连接端口。</p>
   <div class="two"><div><label for="pairIp">手机 IPv4</label><input id="pairIp" placeholder="192.168.31.100"></div><div><label for="pairPort">配对端口</label><input id="pairPort" type="number" min="1" max="65535"></div></div>
   <label for="pairCode">六位配对码</label><input id="pairCode" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="123456">
   <div class="buttons"><button class="secondary" id="pair" type="button">执行配对</button></div>
   <div class="status modal-status" id="pairMessage" role="status" aria-live="polite" hidden></div>
  </details>
 </div>
</dialog>
</main>
<script>
const $=id=>document.getElementById(id);
let devices=[],selected=null,editing=null,loading=false,loaded=false,shotUrl=null;
const groupOpen=new Map();
const labels={connected:'已连接',disconnected:'未连接',connecting:'连接中',checking:'检查中',error:'异常'};
function message(text,kind=''){$('message').textContent=text;$('message').className='status '+kind;}
async function api(path,options={}){
 const r=await fetch(path,{...options,cache:'no-store',headers:{...options.headers,'X-EasyADB-Token':$('token').value.trim()}});
 if(!r.ok){let e={};try{e=await r.json();}catch{}throw Error(typeof e.detail==='string'?e.detail:'请求失败：HTTP '+r.status);}
 return r;
}
function clearShot(){
 $('shot').hidden=true;$('shot').removeAttribute('src');$('placeholder').hidden=false;
 if(shotUrl){URL.revokeObjectURL(shotUrl);shotUrl=null;}
}
function elem(tag,className,text){
 const e=document.createElement(tag);if(className)e.className=className;if(text!==undefined)e.textContent=text;return e;
}
function action(label,handler,cls='secondary'){
 const b=elem('button',cls,label);b.type='button';b.addEventListener('click',handler);return b;
}
function select(id){
 if(selected!==id){selected=id;clearShot();}
 render();
}
function render(){
 const list=$('devices');list.replaceChildren();
 const grouped=new Map();
 for(const d of devices){
  const key=d.group_name?'named:'+d.group_name:'ungrouped';
  if(!grouped.has(key))grouped.set(key,{title:d.group_name||'未分组',items:[]});
  grouped.get(key).items.push(d);
 }
 const keys=[...grouped.keys()].sort((a,b)=>a===b?0:a==='ungrouped'?1:b==='ungrouped'?-1:grouped.get(a).title.localeCompare(grouped.get(b).title,'zh-CN'));
 $('count').textContent=devices.length+' 台设备 · '+keys.length+' 个分组';
 for(const key of keys){
  const group=grouped.get(key);
  const section=elem('details','device-group');
  section.open=groupOpen.has(key)?groupOpen.get(key):true;
  section.addEventListener('toggle',()=>groupOpen.set(key,section.open));
  const summary=elem('summary');
  summary.append(elem('span','',group.title));
  const online=group.items.filter(d=>d.status==='connected').length;
  summary.append(elem('span','group-count',online+' / '+group.items.length+' 已连接'));
  section.append(summary);
  const wrapper=elem('div','group-items');
  for(const d of group.items){
   const item=elem('div','item'+(d.id===selected?' active':''));
   const top=elem('div','item-top');
   const info=elem('div');
   info.append(elem('div','item-name',d.name),elem('div','muted',d.ip+':'+d.port));
   const pill=elem('span','pill '+d.status,labels[d.status]||'待检查');
   top.append(info,pill);item.append(top);
   if(d.model||d.android_version)item.append(elem('div','muted',[d.model,d.android_version?'Android '+d.android_version:''].filter(Boolean).join(' · ')));
   if(d.last_error&&d.status!=='connected')item.append(elem('div','muted',d.last_error));
   const actions=elem('div','item-actions');
   actions.append(action('查看',()=>select(d.id)),action('连接',()=>runConnect(d.id)));
   actions.append(action('编辑',()=>edit(d.id)),action('删除',()=>remove(d.id),'danger'));
   item.append(actions);wrapper.append(item);
  }
  section.append(wrapper);list.append(section);
 }
 if(!devices.length)list.append(elem('p','hint','暂无设备。点击「添加设备」保存第一台手机。'));
 const d=devices.find(x=>x.id===selected);
 $('previewTitle').textContent=d?d.name+' / 设备截图':'设备截图';
 $('previewInfo').textContent=d?(d.ip+':'+d.port+' · '+(labels[d.status]||'待检查')):'从左侧列表选择设备';
 $('connect').disabled=loading||!d;
 $('shotButton').disabled=loading||!d||d.status!=='connected';
 $('refreshAll').disabled=loading||!loaded;
 $('newDevice').disabled=loading||!loaded;
}
async function load(quiet=false){
 if(!$('token').value.trim()){message('请先输入访问密钥','error');return;}
 try{
  const data=await(await api('/api/devices')).json();
  devices=data;loaded=true;if(selected&&!data.some(d=>d.id===selected)){selected=null;clearShot();}
  render();if(!quiet)message('已加载 '+data.length+' 台设备','ok');
 }catch(e){if(!quiet)message(e.message,'error');}
}
function reset(){
 editing=null;$('form').reset();$('auto').checked=true;$('formTitle').textContent='添加设备';$('save').textContent='保存设备';
 $('formMessage').hidden=true;$('formMessage').textContent='';
 $('pairMessage').hidden=true;$('pairMessage').textContent='';
 $('pairCode').value='';$('pairPort').value='';$('pairIp').value='';
}
function modalMessage(text,kind='error',id='formMessage'){
 const el=$(id);el.hidden=false;el.textContent=text;el.className='status modal-status '+kind;
}
function closeModal(){if(loading)return;$('deviceDialog').close();}
function openModal(id=null){
 if(loading||!loaded)return;
 reset();const d=id?devices.find(x=>x.id===id):null;
 if(id&&!d)return;
 const options=$('groupNames');options.replaceChildren();
 for(const name of [...new Set(devices.map(x=>x.group_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'))){
  const opt=document.createElement('option');opt.value=name;options.append(opt);
 }
 if(d){
  editing=id;$('name').value=d.name;$('group').value=d.group_name;
  $('ip').value=d.ip;$('port').value=d.port;$('auto').checked=d.auto_reconnect;
  $('formTitle').textContent='编辑设备';$('save').textContent='保存修改';$('pairIp').value=d.ip;
 }
 $('deviceDialog').showModal();$('name').focus();
}
function edit(id){openModal(id);}
async function runConnect(id){
 if(loading)return;select(id);loading=true;render();message('正在连接所选设备…');
 try{
  const d=await(await api('/api/devices/'+encodeURIComponent(id)+'/connect',{method:'POST'})).json();
  devices=devices.map(x=>x.id===id?d:x);message(d.name+' 已连接','ok');
  await load(true);
 }catch(e){message(e.message,'error');await load(true);}
 finally{loading=false;render();}
}
async function remove(id){
 const d=devices.find(x=>x.id===id);if(!d||loading||!confirm('从列表删除「'+d.name+'」？不会清除手机端 ADB 配对授权。'))return;
 loading=true;render();
 try{await api('/api/devices/'+encodeURIComponent(id),{method:'DELETE'});if(selected===id){selected=null;clearShot();}if(editing===id && !$('deviceDialog').open)reset();await load(true);message('设备已从列表删除','ok');}
 catch(e){message(e.message,'error');}finally{loading=false;render();}
}
$('load').addEventListener('click',()=>load());
$('token').addEventListener('input',()=>{loaded=false;devices=[];selected=null;clearShot();render();});
$('newDevice').addEventListener('click',()=>openModal());
$('closeDialog').addEventListener('click',closeModal);
$('cancelDialog').addEventListener('click',closeModal);
$('deviceDialog').addEventListener('cancel',ev=>{if(loading)ev.preventDefault();});
$('deviceDialog').addEventListener('close',reset);
$('deviceDialog').addEventListener('click',ev=>{
 if(ev.target===$('deviceDialog')&&!loading)closeModal();
});
$('form').addEventListener('submit',async ev=>{
 ev.preventDefault();if(loading)return;loading=true;render();
 const payload={name:$('name').value,group_name:$('group').value,ip:$('ip').value.trim(),port:Number($('port').value),auto_reconnect:$('auto').checked};
 try{
  const url=editing?'/api/devices/'+encodeURIComponent(editing):'/api/devices';
  const d=await(await api(url,{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})).json();
  selected=d.id;clearShot();$('deviceDialog').close();await load(true);message('设备已保存','ok');
 }catch(e){modalMessage(e.message);}finally{loading=false;render();}
});
$('refreshAll').addEventListener('click',async()=>{
 if(loading)return;loading=true;render();message('正在逐台检查 ADB 状态…');
 try{devices=await(await api('/api/devices/refresh',{method:'POST'})).json();render();message('全部设备检查完成','ok');}
 catch(e){message(e.message,'error');}finally{loading=false;render();}
});
$('connect').addEventListener('click',()=>{if(selected)runConnect(selected);});
$('shotButton').addEventListener('click',async()=>{
 const id=selected;if(!id||loading)return;loading=true;render();message('正在获取截图…');
 try{
  const blob=await(await api('/api/devices/'+encodeURIComponent(id)+'/screenshot')).blob();
  if(selected===id){const next=URL.createObjectURL(blob);clearShot();shotUrl=next;$('shot').src=next;$('shot').hidden=false;$('placeholder').hidden=true;message('截图已更新','ok');}
 }catch(e){message(e.message,'error');await load(true);}
 finally{loading=false;render();}
});
$('pair').addEventListener('click',async()=>{
 if(loading)return;loading=true;render();message('正在配对…');
 try{
  const r=await api('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ip:$('pairIp').value.trim()||$('ip').value.trim(),port:Number($('pairPort').value),code:$('pairCode').value.trim()})});
  $('pairCode').value='';modalMessage((await r.json()).message,'ok','pairMessage');
 }catch(e){modalMessage(e.message,'error','pairMessage');}finally{loading=false;render();}
});
// This timer only re-renders the monitor's cached states; it does not send ADB
// commands and does not launch additional connection polling loops.
setInterval(()=>{if(!loading&&$('token').value.trim()&&!document.hidden)load(true);},20000);
render();
</script>
</body>
</html>
