name: Build opt-in CastPlus experiment helper
on:
  workflow_dispatch:
  push:
    branches: [feat/m3-openwrt-discovery]
    paths:
      - 'castplus-helper/**'
      - '.github/workflows/castplus-helper.yml'
permissions:
  contents: read
jobs:
  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug-signed test-only APK
        working-directory: castplus-helper
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: easyadb-castplus-lab-apk
          path: castplus-helper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
