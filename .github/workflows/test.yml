name: EasyADB M2/M3/V2 and OpenWrt regression
on:
  push:
    branches: [feat/m2-web-control, feat/display-mode-lab, feat/m3-openwrt-discovery, refactor/foundation-v1, refactor/v2-session-governance]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r server/requirements.txt
          python -m pip install -r server/requirements-webrtc.txt
          python -m pip install pytest httpx
      - name: Compile code
        run: python -m compileall -q server tests
      - name: Check modal UI and deployment scripts
        run: |
          for script in scripts/*.sh; do sh -n "$script"; done
          python -c 'from pathlib import Path; h=Path("web/index.html").read_text(); assert h.count("<dialog")==5 and "firstPairDialog" in h and "firstPairForm" in h and "groupDialog" in h and "groupPrefix" in h and "deleteGroup" in h and "device-group" in h and "groupOpen" in h; Path("/tmp/easyadb-web.js").write_text(h.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/easyadb-web.js
          node --check web/m2-webrtc.js
          node --check web/m2-traffic.js
          node --check web/m2-touch.js
          node --check web/m2-metrics.js
          node --check web/m2-multi.js
          node --check web/m2-group.js
          node --check web/display-lab.js
          node tests/m2_quality_metrics.cjs
          node tests/m2_multi_contract.cjs
          node tests/m2_twenty_contract.cjs
          node tests/m2_group_contract.cjs
          node tests/m2_batch_connect.cjs
          node tests/device_connect_order_contract.cjs
          node tests/progressive_connect_contract.cjs
          node tests/m2_webrtc_contract.cjs
          node tests/m2_traffic_meter.cjs
          node tests/m2_touch_contract.cjs
          node tests/m3_page_contract.cjs
          node tests/global_toast_contract.cjs
          node tests/inventory_drawer_contract.cjs
          grep -Fq 'sh scripts/update-m2.sh' scripts/build-with-mihomo.sh
          grep -Fxq 'TARGET_BRANCH=feat/m2-web-control' scripts/update-m2.sh
          test ! -e scripts/update-m1.sh
      - name: Check integrated OpenWrt ACL and scanner smoke tests
        run: sh luci-avahi-web/tests/smoke.sh
      - name: Verify V2 release regression gate
        if: github.ref == 'refs/heads/refactor/v2-session-governance'
        env:
          EASYADB_TOKEN: local-test-token-123
        run: python -m pytest -q tests/test_v2_release_gate.py
      - name: Run mock ADB tests
        if: ${{ !cancelled() }}
        env:
          EASYADB_TOKEN: local-test-token-123
        run: python -m pytest -q
