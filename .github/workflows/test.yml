name: M2 tests
# Temporary, strictly one-shot CI trigger for the completed M2 batch.
# Only this workflow path AND exact commit message can execute test job.
on:
  workflow_dispatch:
  push:
    branches: [feat/m2-web-control]
    paths: ['.github/workflows/test.yml']
permissions:
  contents: read
jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'ci: one-shot M2 compile and test') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r server/requirements.txt
          python -m pip install pytest httpx
      - name: Install FFmpeg for actual MSE remux smoke test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Compile code
        run: python -m compileall -q server tests
      - name: Check modal UI and deployment scripts
        run: |
          for script in scripts/*.sh; do sh -n "$script"; done
          python -c 'from pathlib import Path; h=Path("web/index.html").read_text(); assert h.count("<dialog")==3 and "firstPairDialog" in h and "firstPairForm" in h and "groupDialog" in h and "groupPrefix" in h and "deleteGroup" in h and "device-group" in h and "groupOpen" in h; Path("/tmp/easyadb-web.js").write_text(h.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/easyadb-web.js
          node --check web/m2-player.js
          node --check web/m2-traffic.js
          node --check web/m2-touch.js
          node --check web/m2-metrics.js
          node --check web/m2-multi.js
          node tests/m2_quality_metrics.cjs
          node tests/m2_multi_contract.cjs
          node tests/m2_player_contract.cjs
          node tests/m2_traffic_meter.cjs
          node tests/m2_touch_contract.cjs
          grep -Fq 'sh scripts/update-m2.sh' scripts/build-with-mihomo.sh
          grep -Fxq 'TARGET_BRANCH=feat/m2-web-control' scripts/update-m2.sh
          test ! -e scripts/update-m1.sh
      - name: Run mock ADB tests
        env:
          EASYADB_TOKEN: local-test-token-123
        run: python -m pytest -q
