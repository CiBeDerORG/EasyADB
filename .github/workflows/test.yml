name: EasyADB M2 and OpenWrt discovery tests
on:
  push:
    branches: [feat/m2-web-control, feat/display-mode-lab, feat/m3-openwrt-discovery]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r server/requirements.txt
          python -m pip install -r server/requirements-webrtc.txt
          python -m pip install pytest httpx
      - name: Install FFmpeg for actual MSE remux smoke test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Compile code
        run: python -m compileall -q server tests
      - name: Check modal UI and deployment scripts
        run: |
          for script in scripts/*.sh; do sh -n "$script"; done
          python -c 'from pathlib import Path; h=Path("web/index.html").read_text(); assert h.count("<dialog")==4 and "firstPairDialog" in h and "firstPairForm" in h and "groupDialog" in h and "groupPrefix" in h and "deleteGroup" in h and "device-group" in h and "groupOpen" in h; Path("/tmp/easyadb-web.js").write_text(h.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/easyadb-web.js
          node --check web/m2-player.js
          node --check web/m2-webrtc.js
          node --check web/m2-traffic.js
          node --check web/m2-touch.js
          node --check web/m2-metrics.js
          node --check web/m2-multi.js
          node --check web/display-lab.js
          node tests/m2_quality_metrics.cjs
          node tests/m2_multi_contract.cjs
          node tests/m2_batch_connect.cjs
          node tests/m2_player_contract.cjs
          node tests/m2_webrtc_contract.cjs
          node tests/m2_traffic_meter.cjs
          node tests/m2_touch_contract.cjs
          node tests/m3_page_contract.cjs
          grep -Fq 'sh scripts/update-m2.sh' scripts/build-with-mihomo.sh
          grep -Fxq 'TARGET_BRANCH=feat/m2-web-control' scripts/update-m2.sh
          test ! -e scripts/update-m1.sh
      - name: Run mock ADB tests
        if: ${{ !cancelled() }}
        env:
          EASYADB_TOKEN: local-test-token-123
        run: python -m pytest -q
