name: LuCI Avahi Web
on:
  push:
    branches: [feat/luci-avahi-web]
    paths:
      - "luci-avahi-web/**"
      - ".github/workflows/luci-avahi-web.yml"
  pull_request:
    paths:
      - "luci-avahi-web/**"
      - ".github/workflows/luci-avahi-web.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check minimal NAS-only scan ACL, shell, JavaScript, package operations
        run: |
          cd luci-avahi-web
          sh tests/smoke.sh
