services:
  easyadb:
    image: easyadb:local
    build:
      context: .
      # Do not specify build.network: proxy-net; BuildKit does not support
      # custom names in RUN network mode. The helper script creates a dedicated
      # docker-container Buildx builder attached to proxy-net instead.
      args:
        HTTP_PROXY: ${EASYADB_BUILD_PROXY:-http://mihomo:7890}
        HTTPS_PROXY: ${EASYADB_BUILD_PROXY:-http://mihomo:7890}
        http_proxy: ${EASYADB_BUILD_PROXY:-http://mihomo:7890}
        https_proxy: ${EASYADB_BUILD_PROXY:-http://mihomo:7890}
        NO_PROXY: localhost,127.0.0.1
        no_proxy: localhost,127.0.0.1
    restart: unless-stopped
    environment:
      EASYADB_TOKEN: ${EASYADB_TOKEN:?Set EASYADB_TOKEN in .env}
      EASYADB_DB: /app/data/devices.sqlite3
      EASYADB_VIDEO_ENGINE: ${EASYADB_VIDEO_ENGINE:-mse}
      EASYADB_MAPPING_ENABLED: ${EASYADB_MAPPING_ENABLED:-false}
      EASYADB_MAPPING_HOST: 0.0.0.0
      EASYADB_MAPPING_PORT: 8001
      EASYADB_MAPPING_EXTERNAL_PORT: ${EASYADB_MAPPING_PORT:-8766}
      EASYADB_MAPPING_PUBLIC_URL: ${EASYADB_MAPPING_PUBLIC_URL:-}
    ports:
      - "${EASYADB_BIND_IP:-127.0.0.1}:${EASYADB_PORT:-8765}:8000"
      # M1 maps to loopback unless explicitly bound to a trusted LAN interface.
      - "${EASYADB_MAPPING_BIND_IP:-127.0.0.1}:${EASYADB_MAPPING_PORT:-8766}:8001"
    volumes:
      - ./data/adb:/root/.android
      - ./data/storage:/app/data
    networks:
      - default
      - proxy-net

networks:
  proxy-net:
    external: true
    name: proxy-net
